[package]
name = "tidal-engine"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Offline, on-device tide prediction via the harmonic method (NOAA Special Publication No. 98)."
repository = "https://github.com/help-for-me/tidal_chart"

[lib]
name = "tidal_engine"
# staticlib/cdylib so this can be linked into a Swift app (via a
# generated C header / UniFFI bindings) or an Android app (via JNI),
# in addition to being used directly as a Rust crate.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Generates idiomatic Swift/Kotlin bindings from the `#[uniffi::export]`
# annotations below (see docs/ARCHITECTURE.md's "Bindable, not just
# embeddable" note). No UDL file / build.rs needed — `setup_scaffolding!()`
# in lib.rs plus these proc-macro attributes are the whole interface
# description, so the crate stays the single source of truth.
uniffi = "0.32.0"

[dev-dependencies]
uniffi = { version = "0.32.0", features = ["bindgen-tests"] }

[features]
# Off by default so `clap` and friends (needed only to run the
# uniffi-bindgen binary below) don't end up in the iOS/Android staticlib.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]
